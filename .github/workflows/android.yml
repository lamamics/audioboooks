name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Au premier build, génère la clé de signature et la committe dans le repo
      # pour que toutes les APK suivantes soient signées avec la même clé
      # (sinon impossible de mettre à jour l'app sans la désinstaller).
      - name: Generate signing keystore if missing
        run: |
          if [ ! -f keystore/audioboooks.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/audioboooks.jks \
              -alias audioboooks \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass audioboooks -keypass audioboooks \
              -dname "CN=Lamamics, OU=Audioboooks, O=Lamamics, C=FR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f keystore/audioboooks.jks
            git commit -m "Ajout de la cle de signature des releases [skip ci]"
            git push
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Audiobooocs-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audiobooocs-apk
          path: Audiobooocs-*.apk

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Audiobooocs v1.0.${{ github.run_number }}
          body: |
            APK Android signée, installable sur Android 8.0 et plus.

            **Installation** : télécharge le fichier `.apk` ci-dessous sur ton téléphone,
            ouvre-le et autorise l'installation depuis des sources inconnues si demandé.
          files: Audiobooocs-*.apk
